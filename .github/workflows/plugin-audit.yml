# .github/workflows/plugin-audit.yml
#
# Runs the plugin manifest audit on every PR to main, and on every push to main.
# Blocks merge if any drift is detected between plugins/manifest.json and the
# actual codebase (missing files, missing API routes, missing static data,
# dynamicSlots not properly reserved as null in static JSON).
#
# This is the CI enforcement of the contract defined in
# plugins/plugin-manifest.schema.json. See AGENTIC-WORKFLOW-LESSONS.txt for
# the rationale: "the manifest is the contract; the audit is the enforcement."

name: Plugin Manifest Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-audit:
    name: Static drift check (files, routes, dynamism slots)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run plugin manifest audit
        run: bun scripts/audit-plugins.ts

      - name: Upload audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-audit-report
          path: |
            plugins/manifest.json
            plugins/plugin-manifest.schema.json
          retention-days: 7

  live-audit:
    name: Live browser audit (rendered content, back button, console errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          BUILD_STATIC: "true"
          NEXT_PUBLIC_STATIC_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          # Temporarily move /api routes out — they're incompatible with output: export
          if [ -d src/app/api ]; then
            mv src/app/api src/app/__api_static_backup
          fi
          bunx next build
          # Restore /api routes for any subsequent steps
          if [ -d src/app/__api_static_backup ]; then
            mv src/app/__api_static_backup src/app/api
          fi

      - name: Serve static build
        run: |
          cd out
          python3 -m http.server 3001 &
          echo $! > /tmp/server.pid
          sleep 3
          curl -s -o /dev/null -w "Static server: %{http_code}\n" http://localhost:3001/

      - name: Install agent-browser
        run: |
          # agent-browser is a Rust-based headless browser CLI
          # Install via npm global or download the binary
          npm install -g agent-browser 2>/dev/null || true
          which agent-browser && agent-browser --version || echo "agent-browser not available — live audit will be skipped"

      - name: Run live plugin audit
        run: |
          if command -v agent-browser &> /dev/null; then
            bun scripts/audit-plugins-live.ts --url http://localhost:3001
          else
            echo "⚠️  agent-browser not available — skipping live audit"
            echo "To enable live audit in CI, install agent-browser in the workflow."
          fi

      - name: Upload live audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-report
          path: |
            /tmp/audit-*.log
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
