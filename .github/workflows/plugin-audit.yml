# .github/workflows/plugin-audit.yml
#
# Two-gate CI enforcement of the plugin manifest contract:
#
#   1. STATIC AUDIT (fast, ~30s) — verifies files, routes, and dynamism slots
#      exist as declared in plugins/manifest.json. Catches drift between the
#      manifest and the codebase (missing files, missing API routes, missing
#      static data, dynamicSlots not properly reserved as null in static JSON).
#
#   2. LIVE AUDIT (slower, ~2min) — builds the static export, serves it via
#      python http.server, launches Playwright Chromium, navigates to every
#      plugin view, and verifies real rendered content (content length,
#      heading text, back button presence, console error count). Catches
#      regressions the static audit cannot reach: empty pages, broken
#      hydration, runtime crashes, missing UX patterns.
#
# Both gates block merge on failure. There is NO soft-fail — if Playwright
# or Chromium can't be installed, the job fails loudly rather than silently
# skipping the live audit.
#
# This is the CI enforcement of the contract defined in
# plugins/plugin-manifest.schema.json. See AGENTIC-WORKFLOW-LESSONS.txt for
# the rationale: "the manifest is the contract; the audit is the enforcement."

name: Plugin Manifest Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-audit:
    name: Static drift check (files, routes, dynamism slots)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run plugin manifest audit
        run: bun scripts/audit-plugins.ts

      - name: Upload audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-audit-report
          path: |
            plugins/manifest.json
            plugins/plugin-manifest.schema.json
          retention-days: 7

  live-audit:
    name: Live browser audit (rendered content, back button, console errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          # BASE_PATH="" serves from root — required for the audit to find
          # assets at /_next/... instead of /FinRegGuard/_next/...
          # The production GitHub Pages build uses BASE_PATH=/FinRegGuard
          # (see scripts/build-static.sh). CI tests the code, not the deploy.
          BASE_PATH: ""
        run: bash scripts/build-static.sh

      - name: Serve static build
        run: |
          cd out
          python3 -m http.server 3001 &
          echo $! > /tmp/server.pid
          sleep 3
          curl -s -o /dev/null -w "Static server: %{http_code}\n" http://localhost:3001/

      - name: Install Playwright Chromium
        # Hard enforcement: if this step fails, the whole job fails.
        # No soft-fail, no skip. The live audit CANNOT run without a browser.
        run: |
          bunx playwright install --with-deps chromium
          echo "Playwright Chromium installed."

      - name: Run live plugin audit
        # Hard enforcement: if any page fails (content too short, wrong
        # heading, missing back button, console errors), the audit exits
        # non-zero and the PR is blocked. No soft-fail escape hatch.
        run: bun scripts/audit-plugins-live.ts --url http://localhost:3001

      - name: Upload live audit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-audit-report
          path: |
            /tmp/audit-*.log
          retention-days: 7

      - name: Stop static server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
          fi
